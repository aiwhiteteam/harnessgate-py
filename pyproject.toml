[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harnessgate"
version = "0.1.0"
description = "Universal gateway connecting AI agent runtimes to messaging platforms"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49",
    "aiogram>=3.10",
    "aiohttp>=3.9",
    "discord.py>=2.0",
    "slack-bolt>=1.16",
    "slack-sdk>=3.30",
    "botbuilder-core>=4.16",
    "botbuilder-integration-aiohttp>=4.16",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harnessgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
